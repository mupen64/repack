name: Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-stable-w32:
    uses: ./.github/workflows/sync-target.yml
    with:
      target: stable-w32
      mode: stable
      asset: mupen64-w32
      fallback-asset: mupen64.zip
      commit-message: "chore: sync stable releases [skip ci]"

  sync-stable-w64:
    uses: ./.github/workflows/sync-target.yml
    with:
      target: stable-w64
      mode: stable
      asset: mupen64-w64
      commit-message: "chore: sync stable releases [skip ci]"

  sync-nightly-w32:
    uses: ./.github/workflows/sync-target.yml
    with:
      target: nightly-w32
      mode: nightly
      asset: mupen-release-nightly-w32
      commit-message: "chore: sync [skip ci]"

  sync-nightly-w64:
    uses: ./.github/workflows/sync-target.yml
    with:
      target: nightly-w64
      mode: nightly
      asset: mupen-release-nightly-w64
      commit-message: "chore: sync [skip ci]"
