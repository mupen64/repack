name: Sync target branch

on:
  workflow_call:
    inputs:
      target:
        description: Branch to sync and push to
        type: string
        required: true
      mode:
        description: 'stable (release-based) or nightly (artifact-based)'
        type: string
        required: true
      asset:
        description: >
          For stable mode, the mupen64-rr-lua release asset name prefix
          (e.g. mupen64-w32). For nightly mode, the artifact name
          (e.g. mupen-release-nightly-w32).
        type: string
        required: true
      fallback-asset:
        description: >
          For stable mode, the exact name of an alternative release asset
          (e.g. mupen64.zip) to fall back to when the primary asset is not
          found in the latest release. A warning is emitted when the fallback
          is used.
        type: string
        required: false
      commit-message:
        description: Commit message to use when there are changes
        type: string
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}

      - name: Clear branch contents
        run: |
          # The branch is rebuilt from scratch on each sync, so drop everything first
          git rm -rf --ignore-unmatch .

      # Mupen64

      - name: Get latest mupen64-rr-lua release
        id: get-release
        if: inputs.mode == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_API="repos/mupen64/mupen64-rr-lua/releases/latest"
          ASSET_URL=$(gh api "$RELEASE_API" \
            --jq '.assets[] | select(.name | startswith("${{ inputs.asset }}")) | .browser_download_url')
          RELEASE_URL=$(gh api "$RELEASE_API" --jq '.html_url')
          if [ -n "$ASSET_URL" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
            echo "mupen64_link=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.fallback-asset }}" ]; then
            FALLBACK_URL=$(gh api "$RELEASE_API" \
              --jq '.assets[] | select(.name == "${{ inputs.fallback-asset }}") | .browser_download_url')
            if [ -n "$FALLBACK_URL" ]; then
              echo "::warning::FALLBACK USED: mupen64 asset '${{ inputs.asset }}' was not found in the latest release. Falling back to '${{ inputs.fallback-asset }}'. THIS MAY BE AN OUTDATED OR INCORRECT BUILD - verify the upstream release manually!"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "asset_url=$FALLBACK_URL" >> "$GITHUB_OUTPUT"
              echo "mupen64_link=$RELEASE_URL" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and unpack mupen64 stable release
        if: inputs.mode == 'stable' && steps.get-release.outputs.found == 'true'
        run: |
          curl -fsSL "${{ steps.get-release.outputs.asset_url }}" -o mupen64-stable.zip
          mkdir -p _mupen64tmp
          unzip -o mupen64-stable.zip -d _mupen64tmp
          # The zip may wrap the release in a single top-level folder; unwrap it if so
          TOP=$(ls -1 _mupen64tmp/)
          if [ "$(printf '%s\n' "$TOP" | wc -l)" -eq 1 ] && [ -d "_mupen64tmp/$TOP" ]; then
            cp -rf "_mupen64tmp/$TOP/." .
          else
            cp -rf _mupen64tmp/. .
          fi
          rm -rf _mupen64tmp mupen64-stable.zip

      - name: Get latest mupen64-rr-lua main artifact run ID
        id: get-run
        if: inputs.mode == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_SHA=$(gh api \
            "repos/mupen64/mupen64-rr-lua/commits/main" \
            --jq '.sha')
          ARTIFACTS_API="repos/mupen64/mupen64-rr-lua/actions/artifacts?name=${{ inputs.asset }}&per_page=100"
          RUN_IDS=$(gh api "$ARTIFACTS_API" --paginate \
            --jq --arg main_sha "$MAIN_SHA" \
            '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_sha == $main_sha) | .workflow_run.id')
          RUN_ID="${RUN_IDS%%$'\n'*}"
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "mupen64_link=https://github.com/mupen64/mupen64-rr-lua/commit/$MAIN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download mupen64 nightly artifact
        if: inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _nightlytmp
          gh run download ${{ steps.get-run.outputs.run_id }} \
            --repo mupen64/mupen64-rr-lua \
            --name "${{ inputs.asset }}" \
            --dir _nightlytmp
          # If the artifact wraps the release in a single top-level folder, unwrap it; otherwise copy as-is
          TOP=$(ls -1 _nightlytmp/)
          if [ "$(printf '%s\n' "$TOP" | wc -l)" -eq 1 ] && [ -d "_nightlytmp/$TOP" ]; then
            cp -rf "_nightlytmp/$TOP/." .
          else
            cp -rf _nightlytmp/. .
          fi
          rm -rf _nightlytmp

      # SM64LuaRedux

      - name: Get latest SM64LuaRedux release tag
        id: get-sm64-tag
        if: inputs.mode == 'stable' && steps.get-release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api \
            "repos/mupen64/SM64LuaRedux/releases/latest" \
            --jq '.tag_name')
          RELEASE_URL=$(gh api \
            "repos/mupen64/SM64LuaRedux/releases/latest" \
            --jq '.html_url')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sm64_link=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Get SM64LuaRedux main commit
        id: get-sm64-head
        if: inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh api \
            "repos/mupen64/SM64LuaRedux/commits/main" \
            --jq '.sha')
          echo "sm64_link=https://github.com/mupen64/SM64LuaRedux/commit/$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and unpack SM64LuaRedux stable release
        if: inputs.mode == 'stable' && steps.get-release.outputs.found == 'true'
        run: |
          curl -fsSL \
            "https://github.com/mupen64/SM64LuaRedux/archive/refs/tags/${{ steps.get-sm64-tag.outputs.tag }}.zip" \
            -o sm64luaredux-stable.zip
          mkdir -p _sm64stabletmp
          unzip -o sm64luaredux-stable.zip -d _sm64stabletmp
          mkdir -p SM64LuaRedux
          # The zip extracts to a single top-level folder; move its contents into place
          TOP=$(ls _sm64stabletmp/)
          cp -rf "_sm64stabletmp/$TOP/." SM64LuaRedux/
          rm -rf _sm64stabletmp sm64luaredux-stable.zip

      - name: Download SM64LuaRedux source
        if: inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true'
        run: |
          curl -fsSL \
            "https://github.com/mupen64/SM64LuaRedux/archive/refs/heads/main.zip" \
            -o sm64luaredux.zip

      - name: Unpack SM64LuaRedux
        if: inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true'
        run: |
          mkdir -p SM64LuaRedux
          unzip -o sm64luaredux.zip -d _sm64tmp
          # The zip extracts to SM64LuaRedux-main/; copy its contents into place
          cp -rf _sm64tmp/SM64LuaRedux-main/. SM64LuaRedux/
          rm -rf _sm64tmp sm64luaredux.zip

      # LICENSE & README

      - name: Copy LICENSE from main
        if: (inputs.mode == 'stable' && steps.get-release.outputs.found == 'true') || (inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true')
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/LICENSE" -o LICENSE

      - name: Generate README
        if: (inputs.mode == 'stable' && steps.get-release.outputs.found == 'true') || (inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true')
        run: |
          cat > README.md <<'EOF'
          # Mupen64 Repack

          This is the Mupen64 ${{ inputs.mode }} repack, consisting of

          - Mupen64 @ ${{ steps.get-release.outputs.mupen64_link || steps.get-run.outputs.mupen64_link }}
          - SM64 Lua Redux @ ${{ steps.get-sm64-tag.outputs.sm64_link || steps.get-sm64-head.outputs.sm64_link }}

          Update at https://mupen64.com.
          EOF

      # Asset not found: wipe the branch instead of leaving stale content

      - name: Remove all branch files (asset not found)
        if: (inputs.mode == 'stable' && steps.get-release.outputs.found != 'true') || (inputs.mode == 'nightly' && steps.get-run.outputs.found != 'true')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "${{ inputs.commit-message }}"
          git push origin ${{ inputs.target }}

      # Commit & push

      - name: Commit and push changes
        if: (inputs.mode == 'stable' && steps.get-release.outputs.found == 'true') || (inputs.mode == 'nightly' && steps.get-run.outputs.found == 'true')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "${{ inputs.commit-message }}"
          git push origin ${{ inputs.target }}
